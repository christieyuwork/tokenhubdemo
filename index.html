<!doctype html>
<!--
  data-theme MUST match the `mode` passed to <CakeProvider> in src/App.tsx.

  CakeProvider sets this attribute on <html> in a layout effect, so the very
  first paint uses whatever is written here. If the two disagree you get a
  visible flash of the wrong theme before React catches up. Change both together.
-->
<html lang="en" data-theme="light.a">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lenovo Token Hub</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
